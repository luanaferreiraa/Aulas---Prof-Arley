<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Aplicação Web</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <header>
        <div class="logos">
            <img src="/assets/img/logo_fatec_transparente.png" alt="Logo Fatec">
            <img src="/assets/img/logo_cps_transparente.png" alt="Logo CPS">
            <img src="/assets/img/logo_dsm_transparente.png" alt="Logo DSM">
        </div>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/cadastro">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container form-container">
            <h2>Criar Conta</h2>
            <br>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Crie uma senha">
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Desenvolvimento Web I - Prof. Arley &copy; 2026</p>
    </footer>
</body>
</html>
